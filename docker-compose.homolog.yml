services:
  dashboard-homolog:
    build: .
    image: radar-acoes:homolog
    restart: unless-stopped
    init: true
    user: radar
    environment:
      TZ: America/Sao_Paulo
      RADAR_INIT_STORAGE: "0"
    command: ["python", "/app/dashboard.py", "--host", "0.0.0.0", "--port", "8000", "--base-path", "/"]
    expose:
      - "8000"
    volumes:
      - ./tests/fixtures/watchlists:/app/saida:ro
